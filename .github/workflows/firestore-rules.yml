name: Firestore Rules Emulator
on:
  push:
    branches: ['security/firestore-compatibility']
    paths: ['security/firestore/**', '.github/workflows/firestore-rules.yml']
  pull_request:
    paths: ['security/firestore/**', '.github/workflows/firestore-rules.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned test tools
        working-directory: security/firestore
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run demo-project emulator tests
        working-directory: security/firestore
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_TELEMETRY: '1'
        run: npm test
      - name: Run Storage and Firestore cross-service emulator tests
        working-directory: security/firestore
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_TELEMETRY: '1'
        run: npm run test:storage
