name: Flutter Build APK

on:
  workflow_dispatch:
  push:
    branches: [perbaikan-fitur-daerah, fix/profil-sederhana, fix/windows-n4500]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Cache Gradle untuk mempercepat kompilasi Android
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 2. Setup Flutter (Menggunakan channel stable terbaru agar versi Dart-nya sesuai)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true 

      - name: Decode Keystore
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib
          value = os.environ['APP_KEYSTORE_BASE64'].strip()
          if not value:
              raise SystemExit('APP_KEYSTORE_BASE64 is required for a signed APK')
          pathlib.Path('android/app/gereja-app.jks').write_bytes(base64.b64decode(value))
          PY

      - name: Get Dependencies
        run: flutter pub get
        working-directory: . 

      # 👇 EKSEKUSI IKON & SPLASH SCREEN 👇
      - name: Generate Icon & Splash Screen
        run: |
          dart run flutter_launcher_icons
        working-directory: . 

      # JURUS SAKTI PENYUNTIK BRANKAS LENGKAP
      - name: Create Secrets File
        env:
          APP_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          APP_TELEGRAM: ${{ secrets.TELE_BOT_TOKEN }}
          APP_ONESIGNAL: ${{ secrets.ONESIGNAL_REST_KEY }}
          APP_PIXABAY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          bindings = {'geminiApiKey': 'APP_GEMINI', 'teleBotTokenSecret': 'APP_TELEGRAM',
                      'osRestKeySecret': 'APP_ONESIGNAL', 'pixabayApiKey': 'APP_PIXABAY'}
          source = '\n'.join('const String ' + key + ' = ' +
                             json.dumps(os.environ.get(env, ''), ensure_ascii=True).replace('$', '\\$') + ';'
                             for key, env in bindings.items())
          pathlib.Path('lib/secrets.dart').write_text(source + '\n')
          PY
        
      - name: Analyze all application code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test all regressions
        run: |
          flutter test
          dart test/bible_data_check.dart test/fixtures/bible-audit-fixture.json

      - name: Build APK
        run: flutter build apk --release --build-name=1.1.0 --build-number=${{ github.run_number }}
        working-directory: .

      - name: Verify signed APK and bundled offline dictionary
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          apk = pathlib.Path('build/app/outputs/flutter-apk/app-release.apk')
          with zipfile.ZipFile(apk) as package:
              for asset in ('assets/dictionary/offline.sqlite', 'assets/TB.SQLite3'):
                  packed = package.read('assets/flutter_assets/' + asset)
                  expected = pathlib.Path(asset).read_bytes()
                  assert hashlib.sha256(packed).digest() == hashlib.sha256(expected).digest(), asset
          print('APK contains the tested offline dictionary and Bible data')
          PY
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner_path" verify build/app/outputs/flutter-apk/app-release.apk

      # =========================================================
      # 📦 3. KOMPRES APK MENJADI FILE ZIP (HEMAT PENYIMPANAN)
      # =========================================================
      - name: Kompres APK ke ZIP
        run: |
          cd build/app/outputs/flutter-apk
          zip -j app-release.zip app-release.apk

      # Upload Artifact di GitHub lebih dulu agar APK tetap tersedia
      # meskipun layanan Telegram sedang bermasalah.
      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-zip
          path: build/app/outputs/flutter-apk/app-release.zip
          if-no-files-found: error

      # =========================================================
      # 🚀 4. KIRIM FILE ZIP LANGSUNG KE TELEGRAM
      # =========================================================
      - name: Kirim ZIP ke Telegram
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: build/app/outputs/flutter-apk/app-release.zip
          message: |
            🚀 *Build APK Selesai!*
            
            📦 File APK sudah dikompresi ke format `.zip` agar lebih hemat kuota & penyimpanan. 
            Silakan unduh dan ekstrak untuk menginstal.

