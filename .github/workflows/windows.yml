name: Windows Desktop Preview
on:
  workflow_dispatch:
  push:
    branches: [fitur-windows, fix/windows-n4500]
    paths: ['lib/**', 'test/**', 'pubspec.yaml', 'tool/**', 'windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare native Windows runner
        run: ./tool/prepare_windows.ps1
      - name: Test Firebase archive preparation
        run: python -m unittest discover -s test/native -p 'test_*.py'
      - name: Get dependencies
        run: flutter pub get
      - name: Generate existing app secret constants
        env:
          APP_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          APP_TELEGRAM: ${{ secrets.TELE_BOT_TOKEN }}
          APP_ONESIGNAL: ${{ secrets.ONESIGNAL_REST_KEY }}
          APP_PIXABAY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          function DartLiteral([string]$value) {
            return "'" + $value.Replace('\','\\').Replace("'","\'").Replace('$','\$').Replace("`r",'\r').Replace("`n",'\n') + "'"
          }
          $source = @(
            ('const String geminiApiKey = ' + (DartLiteral $env:APP_GEMINI) + ';'),
            ('const String teleBotTokenSecret = ' + (DartLiteral $env:APP_TELEGRAM) + ';'),
            ('const String osRestKeySecret = ' + (DartLiteral $env:APP_ONESIGNAL) + ';'),
            ('const String pixabayApiKey = ' + (DartLiteral $env:APP_PIXABAY) + ';')
          )
          Set-Content lib/secrets.dart $source
      - name: Analyze application
        run: |
          $analysisOutput = & flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1
          $analysisStatus = $LASTEXITCODE
          $analysisOutput | ForEach-Object {
            $line = $_.ToString()
            Write-Output $line
            if ($line -match '\berror\s+[-•]\s+(.*?)\s+[-•]\s+(.+?):(\d+):(\d+)\s+[-•]') {
              $message = $Matches[1].Replace('%', '%25')
              Write-Output "::error file=$($Matches[2]),line=$($Matches[3]),col=$($Matches[4])::$message"
            }
          }
          exit $analysisStatus
      - name: Test regressions on Windows
        run: |
          flutter test --reporter json 2>&1 | Tee-Object -FilePath flutter-test-results.json
          $testStatus = $LASTEXITCODE
          $testNames = @{}
          Get-Content flutter-test-results.json | ForEach-Object {
            try {
              $event = $_ | ConvertFrom-Json -ErrorAction Stop
              if ($event.type -eq 'testStart') { $testNames[$event.test.id] = $event.test.name }
              if ($event.type -eq 'error') {
                $message = ("$($testNames[$event.testID]): $($event.error)").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error::$message"
              }
            } catch { }
          }
          if ($testStatus -ne 0) { exit $testStatus }
          dart test/bible_data_check.dart test/fixtures/bible-audit-fixture.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows x64
        run: flutter build windows --release
      - name: Test baseline Snappy codec
        run: |
          & 'build/windows/x64/native-tests/Release/gkii_snappy_test.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify executable and offline SQLite asset
        run: |
          $releasePath = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$releasePath/gereja_mobile.exe")) { throw 'Executable missing' }
          if (!(Test-Path "$releasePath/data/flutter_assets/assets/TB.SQLite3")) { throw 'Bible database missing' }
          if (!(Test-Path "$releasePath/data/flutter_assets/assets/dictionary/offline.sqlite")) { throw 'Offline dictionary database missing' }
          if ((Get-FileHash "$releasePath/data/flutter_assets/assets/dictionary/offline.sqlite").Hash -ne (Get-FileHash 'assets/dictionary/offline.sqlite').Hash) { throw 'Packaged dictionary differs from tested dictionary' }
          if (!(Test-Path "$releasePath/sqlite3.dll")) { throw 'SQLite runtime missing' }
          Copy-Item docs/WINDOWS_PREVIEW.md "$releasePath/BACA_DULU.md"
          Get-FileHash "$releasePath/gereja_mobile.exe" -Algorithm SHA256
      - name: Smoke test native startup without accounts or production writes
        run: |
          $readyPath = Join-Path $env:RUNNER_TEMP ('gkii-ready-' + [Guid]::NewGuid() + '.txt')
          $env:GKII_SMOKE_READY_PATH = $readyPath
          $appProcess = Start-Process -FilePath 'build/windows/x64/runner/Release/gereja_mobile.exe' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(25)
            while (!(Test-Path $readyPath) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
              $appProcess.Refresh()
              if ($appProcess.HasExited) { throw 'Windows app exited during startup' }
            }
            if (!(Test-Path $readyPath)) { throw 'First Flutter frame was not reached' }
            Write-Output 'Windows Firebase/SQLite initialization and first Flutter frame passed'
          } finally {
            $appProcess.Refresh()
            if (!$appProcess.HasExited) { Stop-Process -Id $appProcess.Id }
            Remove-Item Env:GKII_SMOKE_READY_PATH
            if (Test-Path $readyPath) { Remove-Item $readyPath }
          }
      - name: Package complete portable folder
        run: |
          $symbols = Get-ChildItem 'build/windows/x64' -Filter '*.pdb' -Recurse
          if (!$symbols) { throw 'Native debug symbols missing' }
          New-Item -ItemType Directory -Path 'windows-debug-symbols' | Out-Null
          $symbols | ForEach-Object { Copy-Item $_.FullName 'windows-debug-symbols' }
          $portable = Join-Path $env:RUNNER_TEMP ('gkii-portable-' + [Guid]::NewGuid())
          Copy-Item 'build/windows/x64/runner/Release' $portable -Recurse
          Get-ChildItem $portable -Filter '*.pdb' -Recurse | Remove-Item
          Compress-Archive -Path "$portable/*" -DestinationPath 'GKII-Mobile-Windows-x64.zip' -CompressionLevel Optimal
          Remove-Item $portable -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GKII-Mobile-Windows-debug-symbols
          path: windows-debug-symbols/*.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: GKII-Mobile-Windows-x64
          path: GKII-Mobile-Windows-x64.zip
      - name: Export generated runner for reproducible review
        uses: actions/upload-artifact@v4
        with:
          name: windows-runner-source
          path: |
            windows/CMakeLists.txt
            windows/runner/**
            windows/flutter/CMakeLists.txt
            windows/.gitignore
